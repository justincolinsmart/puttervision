<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Putter Speed Tracker</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1e1e1e;
            color: white;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        #video-container {
            position: relative;
            display: inline-block;
            margin-top: 20px;
            border: 4px solid #333;
            border-radius: 8px;
            overflow: hidden;
        }
        video, canvas {
            display: block;
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 10;
        }
        .dashboard {
            margin-top: 20px;
            padding: 20px;
            background: #2a2a2a;
            border-radius: 8px;
            display: inline-block;
        }
        .speed-display {
            font-size: 3em;
            font-weight: bold;
            color: #00ff88;
        }
        .instructions {
            max-width: 600px;
            margin: 20px auto;
            color: #aaa;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <h1>Putter Speed Tracker</h1>
    <div class="instructions">
        Place a <strong>bright red sticker or tape</strong> on your putter head. <br>
        Ensure you are in a well-lit room without other bright red objects in the background.
    </div>

    <div id="video-container">
        <video id="webcam" width="640" height="480" autoplay playsinline muted style="display:none;"></video>
        <canvas id="outputCanvas" width="640" height="480"></canvas>
    </div>

    <div class="dashboard">
        <div>Current Speed (Pixels / Second)</div>
        <div class="speed-display" id="speedOutput">0</div>
    </div>

    <script>
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('outputCanvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const speedOutput = document.getElementById('speedOutput');

        let lastX = null;
        let lastY = null;
        let lastTime = null;

        // 1. Request access to the webcam
        navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 } })
            .then(stream => {
                video.srcObject = stream;
                video.play();
                requestAnimationFrame(processFrame);
            })
            .catch(err => {
                alert("Error accessing webcam: " + err);
            });

        // 2. Main processing loop
        function processFrame() {
            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                // Draw current video frame to canvas
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                
                // Get pixel data from the canvas
                const frameData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const data = frameData.data;

                let totalX = 0, totalY = 0, count = 0;

                // 3. Scan pixels for a specific color (Bright Red)
                for (let i = 0; i < data.length; i += 4) {
                    const r = data[i];
                    const g = data[i + 1];
                    const b = data[i + 2];

                    // Simple threshold for "Red" - High red, low green and blue
                    if (r > 150 && g < 80 && b < 80) {
                        const pixelIndex = i / 4;
                        const x = pixelIndex % canvas.width;
                        const y = Math.floor(pixelIndex / canvas.width);
                        
                        totalX += x;
                        totalY += y;
                        count++;
                    }
                }

                // 4. If we found a big enough red spot, calculate speed
                if (count > 50) { // Minimum pixel count to avoid random noise
                    const currentX = totalX / count; // Center X of the red blob
                    const currentY = totalY / count; // Center Y of the red blob
                    const currentTime = performance.now();

                    // Draw a green circle over the tracked putter
                    ctx.beginPath();
                    ctx.arc(currentX, currentY, 10, 0, 2 * Math.PI);
                    ctx.fillStyle = "#00ff88";
                    ctx.fill();
                    ctx.lineWidth = 2;
                    ctx.strokeStyle = "white";
                    ctx.stroke();

                    // Calculate speed if we have a previous frame to compare to
                    if (lastX !== null && lastY !== null && lastTime !== null) {
                        const dt = (currentTime - lastTime) / 1000; // Time difference in seconds
                        
                        // Distance formula: sqrt((x2 - x1)^2 + (y2 - y1)^2)
                        const dx = currentX - lastX;
                        const dy = currentY - lastY;
                        const distance = Math.sqrt(dx * dx + dy * dy); 
                        
                        // Speed = Distance / Time
                        let speedPxPerSec = distance / dt;
                        
                        // Smooth the output slightly so it doesn't jitter too much
                        speedOutput.innerText = Math.round(speedPxPerSec);
                    }

                    // Update last known positions
                    lastX = currentX;
                    lastY = currentY;
                    lastTime = currentTime;
                } else {
                    // Lost track of the putter
                    lastX = null;
                    lastY = null;
                    lastTime = null;
                    speedOutput.innerText = "0";
                }
            }

            // Loop again for the next frame
            requestAnimationFrame(processFrame);
        }
    </script>
</body>
</html>
