<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Putter Tracker - Front Cam</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #000;
            color: white;
            text-align: center;
            margin: 0;
            overflow: hidden; /* Prevents bouncing on mobile */
        }
        #video-container {
            position: relative;
            width: 100vw;
            height: 70vh;
            background: #111;
        }
        video {
            display: none; /* We draw the video onto the canvas instead */
        }
        canvas {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .dashboard {
            height: 30vh;
            background: #1a1a1a;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-top: 2px solid #333;
        }
        .speed-val {
            font-size: 4rem;
            font-weight: 900;
            color: #00ff88;
            margin: 0;
        }
        .label {
            color: #888;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>

    <div id="video-container">
        <video id="webcam" playsinline muted></video>
        <canvas id="outputCanvas"></canvas>
    </div>

    <div class="dashboard">
        <p class="label">Putter Speed</p>
        <p class="speed-val" id="speedOutput">0</p>
        <p class="label">Pixels/Sec</p>
    </div>

    <script>
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('outputCanvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const speedOutput = document.getElementById('speedOutput');

        let lastX = null, lastY = null, lastTime = null;

        // Start Camera - Specifically requesting the FRONT camera
        navigator.mediaDevices.getUserMedia({ 
            video: { 
                facingMode: "user",
                width: { ideal: 640 },
                height: { ideal: 480 }
            } 
        })
        .then(stream => {
            video.srcObject = stream;
            video.play();
            requestAnimationFrame(processFrame);
        })
        .catch(err => alert("Camera error: " + err));

        function processFrame() {
            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                // Match canvas size to video size
                if (canvas.width !== video.videoWidth) {
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                }

                // 1. Draw the actual camera view
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                
                const frameData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const data = frameData.data;
                let totalX = 0, totalY = 0, count = 0;

                // 2. Track the RED dot
                for (let i = 0; i < data.length; i += 4) {
                    const r = data[i], g = data[i+1], b = data[i+2];
                    // Detection for bright red
                    if (r > 160 && g < 90 && b < 90) {
                        const pixelIndex = i / 4;
                        totalX += pixelIndex % canvas.width;
                        totalY += Math.floor(pixelIndex / canvas.width);
                        count++;
                    }
                }

                if (count > 40) {
                    const curX = totalX / count;
                    const curY = totalY / count;
                    const curTime = performance.now();

                    // 3. DRAW THE HIGHLIGHT (The "Target")
                    // Outer Ring
                    ctx.beginPath();
                    ctx.arc(curX, curY, 25, 0, Math.PI * 2);
                    ctx.strokeStyle = "#00ff88";
                    ctx.lineWidth = 3;
                    ctx.stroke();
                    
                    // Center Dot
                    ctx.beginPath();
                    ctx.arc(curX, curY, 5, 0, Math.PI * 2);
                    ctx.fillStyle = "#fff";
                    ctx.fill();

                    // 4. Calculate Speed
                    if (lastX !== null && lastTime !== null) {
                        const dt = (curTime - lastTime) / 1000;
                        const dist = Math.sqrt((curX - lastX)**2 + (curY - lastY)**2);
                        const speed = dist / dt;
                        if (speed < 5000) { // Filter out "teleportation" glitches
                            speedOutput.innerText = Math.round(speed);
                        }
                    }
                    lastX = curX; lastY = curY; lastTime = curTime;
                } else {
                    speedOutput.innerText = "0";
                    lastX = null;
                }
            }
            requestAnimationFrame(processFrame);
        }
    </script>
</body>
</html>
